[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-jailbreak-intent-classifier"
version = "0.1.0"
description = "Ultra-fast embedding-free semantic intent classifier that detects adversarial override patterns and prompt manipulation in under 1ms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
semantic-jailbreak-intent-classifier = "semantic_jailbreak_intent_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_jailbreak_intent_classifier*"]
